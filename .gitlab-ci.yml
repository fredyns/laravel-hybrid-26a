# ---------------------------------------------------------------------------
# Stages are lifecycle phases, not environments. The environment lives in the
# job name (`deploy:staging:code`) and in `environment:`, so adding production
# later means adding jobs, not duplicating the stage list.
# ---------------------------------------------------------------------------
stages:
  - build
  - test
  - deploy
  - verify

variables:
  GIT_DEPTH: "20"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# Run on merge requests and on branch pushes, but never both for the same commit.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure


# ===========================================================================
# TEMPLATES
# ===========================================================================

# PHP 8.5 CLI matching deployment/docker/php/Dockerfile.
.php:
  image: php:8.5-cli-alpine
  before_script:
    - apk add --no-cache git unzip libzip
    - apk add --no-cache --virtual .build-deps $PHPIZE_DEPS libzip-dev
    - docker-php-ext-install -j"$(nproc)" zip pcntl
    - apk del .build-deps
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # Flux Pro lives behind composer auth; set FLUX_USERNAME / FLUX_LICENSE_KEY
    # as masked CI/CD variables (Settings > CI/CD > Variables).
    - composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

# glibc, not musl: the pinned optionalDependencies are *-linux-x64-gnu builds.
.node:
  image: node:22-bookworm-slim

# Single source of truth for SSH setup — previously copy-pasted into six jobs.
.ssh_staging:
  image: alpine:3.21
  variables:
    SSH_TARGET: "${SSH_USER_STAGING}@${SSH_STAGING}"
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    # Key is piped straight into the agent — never written to disk.
    - printf '%s\n' "$SSH_PRIVATE_KEY_STAGING" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS_STAGING" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS_STAGING" > ~/.ssh/known_hosts
      else
        echo "WARNING: SSH_KNOWN_HOSTS_STAGING is unset — trusting the host on first sight."
        echo "Set it (ssh-keyscan -H <host>) to protect the deploy against MITM."
        ssh-keyscan -H "$SSH_STAGING" >> ~/.ssh/known_hosts 2>/dev/null
      fi
      chmod 600 ~/.ssh/known_hosts

.staging_only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# ===========================================================================
# BUILD
# ===========================================================================

build:vendor:
  extends: .php
  stage: build
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .cache/composer
  script:
    - composer install --prefer-dist --no-progress --optimize-autoloader
  artifacts:
    expire_in: 1 hour
    paths:
      - vendor/

build:assets:
  extends: .node
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - public/build/


# ===========================================================================
# TEST — none of this existed before; main was deployed unverified.
# ===========================================================================

test:lint:
  extends: .php
  stage: test
  needs: [build:vendor]
  script:
    - composer lint:check

test:types:
  extends: .php
  stage: test
  needs: [build:vendor]
  script:
    - composer types:check

test:pest:
  extends: .php
  stage: test
  needs:
    - build:vendor
    - build:assets
  script:
    - cp .env.example .env
    - php artisan key:generate
    - php artisan test --compact


# ===========================================================================
# DEPLOY — staging
# ===========================================================================

# Destructive: tears the app down, re-clones, rebuilds every container.
# Manual on purpose. `allow_failure: false` makes the block explicit rather
# than relying on the manual-job default.
deploy:staging:containers:
  extends: .ssh_staging
  stage: deploy
  interruptible: false
  resource_group: staging
  timeout: 30 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  script:
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' bash -s" < deployment/scripts/app_delete.sh
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' CI_PROJECT_PATH='$CI_PROJECT_PATH' token_pull='$token_pull' bash -s" < deployment/scripts/git_clone.sh
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' CI_PROJECT_PATH='$CI_PROJECT_PATH' token_pull='$token_pull' bash -s" < deployment/env/staging/deploy_container.sh
  environment:
    name: staging
    url: "$APP_URL"
    deployment_tier: staging

deploy:staging:code:
  extends:
    - .ssh_staging
    - .staging_only
  stage: deploy
  needs:
    - test:lint
    - test:types
    - test:pest
  interruptible: false
  resource_group: staging
  timeout: 20 minutes
  script:
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' CI_PROJECT_PATH='$CI_PROJECT_PATH' token_pull='$token_pull' bash -s" < deployment/scripts/git_pull.sh
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' CI_PROJECT_PATH='$CI_PROJECT_PATH' token_pull='$token_pull' bash -s" < deployment/env/staging/deploy_code.sh
  environment:
    name: staging
    url: "$APP_URL"
    deployment_tier: staging


# ===========================================================================
# VERIFY — read-only diagnostics
# ===========================================================================

verify:staging:containers:
  extends:
    - .ssh_staging
    - .staging_only
  stage: verify
  needs: [deploy:staging:code]
  script:
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' bash -s" < deployment/scripts/check_containers.sh
  environment:
    name: staging
    action: verify

verify:staging:routes:
  extends: .ssh_staging
  stage: verify
  needs: [deploy:staging:code]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' bash -s" < deployment/scripts/check_routes.sh
  environment:
    name: staging
    action: verify


# ===========================================================================
# MAINTENANCE — one-off write operations, kept out of the verify group
# ===========================================================================

maintenance:staging:git-remote:
  extends: .ssh_staging
  stage: verify
  needs: []
  resource_group: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - ssh "$SSH_TARGET" "CI_PROJECT_NAME='$CI_PROJECT_NAME' CI_PROJECT_PATH='$CI_PROJECT_PATH' token_pull='$token_pull' bash -s" < deployment/scripts/set_git_remote.sh
  environment:
    name: staging
    action: prepare
